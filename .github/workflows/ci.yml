name: correctness
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      heavy:
        description: Run bounded Release oracle and training smoke
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - run: rustup override set 1.98.1
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features -- --skip generated_tactical_states_agree_with_all_legal_defender_oracle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.2.6
      - run: cargo build --release -p rustmoku-arena -p rustmoku-data
      - run: python -X utf8 -m unittest discover -s training -p "test_*.py"
      - run: python -X utf8 -m unittest discover -s apps/rustmoku-arena -p "test_*.py"
  heavy:
    if: github.event_name == 'workflow_dispatch' && inputs.heavy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: rustup override set 1.98.1
      - run: cargo test --release -p rustmoku-engine --all-features
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.2.6
      - run: cargo build --release -p rustmoku-data -p rustmoku-arena
      - run: python training/pipeline.py --config training/smoke-linux.json --output target/ci-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-smoke
          path: target/ci-smoke
